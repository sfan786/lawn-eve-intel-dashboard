[tool.ruff]
line-length = 120
target-version = "py311"
# Deployment modules are generated by tools/bootstrap_deployment.py — large
# data literals, not hand-maintained code.
extend-exclude = ["deployments/*.py", ".venv", "static"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — undefined names, unused imports
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # flake8-bugbear — likely bugs
    "UP",   # pyupgrade
    "C4",   # comprehension simplification
]
ignore = [
    "E501",  # line length — enforced loosely via line-length, not as an error
    "B008",  # function call in default arg — Flask/decorator idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally poke at module privates and re-import inside functions.
"tests/*" = ["E402"]
